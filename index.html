<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSE Hackathon 2026</title>
<meta name="description" content="RSE Hackathon 2026 — Glasgow, 27-28 November. Register on Eventbrite.">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --accent: #ff6b8a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem 1.5rem;
  }

  main {
    max-width: 640px;
  }

  .eyebrow {
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 0 0 1rem;
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    line-height: 1.1;
    margin: 0 0 0.75rem;
  }

  .details {
    font-size: 1.15rem;
    color: var(--fg);
    opacity: 0.85;
    margin: 0 0 2.5rem;
  }

  .details strong {
    color: var(--accent);
  }

  .cta {
    display: inline-block;
    background: var(--accent);
    color: #000000;
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta:hover,
  .cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 107, 138, 0.35);
  }

  footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Glasgow &middot; 27&ndash;28 November 2026</p>
    <h1>RSE Hackathon 2026</h1>
    <p class="details">Two days of building, together in <strong>Glasgow</strong>.<br>Save your spot below.</p>
    <a class="cta" href="https://www.eventbrite.com/e/REPLACE-WITH-YOUR-EVENT-LINK" target="_blank" rel="noopener">
      Register on Eventbrite
    </a>
    <footer>RSE Hackathon 2026</footer>
  </main>
</body>
</html>
